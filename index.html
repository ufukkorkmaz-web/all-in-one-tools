<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toolbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Landing page. Every tool is one entry in the TOOLS list at the bottom of this file. */
:root {
  --bg: #f3f4fa;
  --bg-glow: rgba(99, 102, 241, 0.10);
  --surface: #ffffff;
  --surface-2: #f6f7fc;
  --fg: #151a2c;
  --muted: #5d6680;
  --line: #dfe2ee;
  --accent: #4f46e5;
  --accent-2: #7c3aed;
  --accent-soft: rgba(79, 70, 229, 0.10);
  --shadow: 0 1px 2px rgba(20, 26, 60, 0.05), 0 8px 24px -12px rgba(20, 26, 60, 0.16);
  --shadow-up: 0 2px 4px rgba(20, 26, 60, 0.06), 0 18px 36px -16px rgba(79, 70, 229, 0.35);
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f1a; --bg-glow: rgba(124, 92, 255, 0.14); --surface: #131929; --surface-2: #19203a; --fg: #e8ecf6; --muted: #98a2bb; --line: #263049;
    --accent: #8b8cff; --accent-2: #a78bfa; --accent-soft: rgba(139, 140, 255, 0.14);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
    --shadow-up: 0 2px 4px rgba(0, 0, 0, 0.4), 0 18px 36px -16px rgba(139, 140, 255, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f1a; --bg-glow: rgba(124, 92, 255, 0.14); --surface: #131929; --surface-2: #19203a; --fg: #e8ecf6; --muted: #98a2bb; --line: #263049;
  --accent: #8b8cff; --accent-2: #a78bfa; --accent-soft: rgba(139, 140, 255, 0.14);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
  --shadow-up: 0 2px 4px rgba(0, 0, 0, 0.4), 0 18px 36px -16px rgba(139, 140, 255, 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { height: 100%; }
/* One-screen layout: the page is exactly as tall as the window. Only if the window is
   too small for the fixed parts does the page itself scroll; a long tool list scrolls
   inside the grid instead. */
body {
  height: 100vh; height: 100dvh; overflow-y: auto; margin: 0;
  background: var(--bg) radial-gradient(1000px 480px at 80% -10%, var(--bg-glow), transparent 70%) no-repeat;
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(14px, env(safe-area-inset-top, 0px));
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column;
}
.wrap { flex: 1; min-height: 0; width: 100%; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: clamp(10px, 2vh, 20px); }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 11px; }
.logo { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: #fff; flex: none;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 16px -6px var(--accent); }
.brand b { font-family: var(--font-display); font-size: 1.25rem; letter-spacing: -0.02em; }
.iconbtn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; box-shadow: var(--shadow); transition: color .15s, border-color .15s; }
.iconbtn:hover { color: var(--fg); border-color: var(--accent); }

.hero { display: flex; flex-direction: column; gap: 4px; }
.hero h1 { font-family: var(--font-display); font-size: clamp(1.5rem, 1.1rem + 1.6vw + 0.8vh, 2.5rem); line-height: 1.08; letter-spacing: -0.03em; margin: 0; }
.hero h1 span { background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { margin: 0; color: var(--muted); font-size: 0.95rem; max-width: 760px; }

.controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.search { flex: 1 1 280px; max-width: 460px; display: flex; align-items: center; gap: 9px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 2px 6px 2px 14px; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
.search svg { color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 14px; padding: 9px 2px; }
.search input::placeholder { color: var(--muted); opacity: .75; }
.search kbd { font-family: var(--font-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-right: 4px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 13px; font-weight: 500; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; cursor: pointer; transition: color .15s, border-color .15s, background .15s; }
.chip:hover { color: var(--fg); border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.count { margin-left: auto; color: var(--muted); font-size: 12.5px; font-family: var(--font-mono); }

/* The tool list fills the space that is left. The padding / negative margin pair keeps
   the hover lift and shadow from being clipped by the scroll area. */
main { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; padding: 6px 4px 20px; margin: -6px -4px -20px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; align-items: start; }

/* Compact card: tile on the left, name + arrow on top, description and tags below. */
.card { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 4px; align-content: start; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); color: inherit; text-decoration: none; transition: transform .18s, box-shadow .18s, border-color .18s; }
a.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-up); border-color: var(--accent); }
.tile { grid-column: 1; grid-row: 1 / 3; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--c1, var(--accent)), var(--c2, var(--accent-2))); box-shadow: 0 6px 14px -8px var(--c1, var(--accent)); }
.tile svg { width: 20px; height: 20px; }
.card h2 { grid-column: 2; grid-row: 1; align-self: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-display); font-size: 1.05rem; margin: 0; letter-spacing: -0.01em; }
.card p { grid-column: 2 / 4; grid-row: 2; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tags { grid-column: 1 / -1; grid-row: 3; margin-top: 6px; display: flex; flex-wrap: nowrap; gap: 5px; overflow: hidden; }
.tag { white-space: nowrap; font-size: 11.5px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }
.open { grid-column: 3; grid-row: 1; align-self: center; display: inline-flex; align-items: center; font-size: 0; color: var(--accent); }
.open svg { width: 18px; height: 18px; transition: transform .18s; }
a.card:hover .open svg { transform: translateX(4px); }
.card.soon { border-style: dashed; background: transparent; box-shadow: none; align-content: center; }
.card.soon .tile { background: var(--surface-2); color: var(--muted); box-shadow: none; border: 1px dashed var(--line); }
.empty { text-align: center; color: var(--muted); padding: 24px 10px; }

footer { text-align: center; font-size: 12px; color: var(--muted); letter-spacing: 0.02em; margin-top: auto; }


/* CSS Tools is always the final, expandable home-page tile. */
.css-group { grid-column: auto; position: relative; padding: 0; display: block; overflow: visible; }
.css-group:is(.is-open, :hover, :focus-within) { z-index: 20; }
.css-toggle { appearance: none; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer; width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 4px; align-content: start; padding: 14px; border-radius: 16px; }
.css-toggle h2 { align-self: center; }
.css-toggle .open svg { transition: transform .18s; }
.css-group.is-open .css-toggle .open svg, .css-group:hover .css-toggle .open svg { transform: rotate(90deg); }
.css-group:hover { border-color: var(--accent); box-shadow: var(--shadow-up); }
.css-group:is(.is-open, :hover, :focus-within) { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.css-children { display: none; position: absolute; top: 100%; left: -1px; right: -1px; z-index: 21; padding: 10px 12px 12px; gap: 7px; background: var(--surface); border: 1px solid var(--accent); border-top: 0; border-radius: 0 0 16px 16px; box-shadow: var(--shadow-up); }
.css-group.is-open .css-children, .css-group:focus-within .css-children { display: grid; }
.css-child { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; color: var(--fg); text-decoration: none; font-size: 13px; font-weight: 600; }
.css-child:hover, .css-child:focus-visible { border-color: var(--accent); color: var(--accent); }
.css-child svg { width: 15px; height: 15px; }
@media (hover: hover) and (pointer: fine) { .css-group:hover .css-children { display: grid; } }
@media (max-width: 560px) { .css-toggle { padding: 12px; } }

/* Shorter windows: drop the nice-to-haves first. */
@media (max-height: 640px) { .tags { display: none; } }
@media (max-height: 560px) { .hero p { display: none; } }
@media (max-height: 480px) { .hero { display: none; } .card.soon { display: none; } }
@media (max-width: 560px) and (max-height: 680px) { .card.soon { display: none; } }
/* Phones */
@media (max-width: 560px) {
  .count { display: none; }
  .search kbd { display: none; }
  .hero p { display: none; }
  .card { padding: 12px; }
  .grid { gap: 10px; }
  .tags { display: none; }
  .card p { -webkit-line-clamp: 1; line-clamp: 1; }
}
@media (max-width: 560px) and (max-height: 760px) { .card p { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>
      <b>Toolbox</b>
    </div>
    <button class="iconbtn" id="theme" type="button" title="Switch light / dark" aria-label="Switch light or dark theme">
      <svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
  </header>

  <section class="hero">
    <h1>Small tools that <span>just work</span>.</h1>
    <p>Free, fast and private. Everything runs in your browser, so nothing you type is uploaded anywhere.</p>
  </section>

  <section class="controls" aria-label="Find a tool">
    <label class="search">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search tools" aria-label="Search tools">
      <kbd aria-hidden="true">/</kbd>
    </label>
    <div class="chips" id="chips" role="group" aria-label="Category"></div>
    <span class="count" id="count" aria-live="polite"></span>
  </section>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </main>

  <footer>Ufuk Korkmaz - 2026</footer>
</div>

<script>
/* To add a tool: put its .html file next to this page and add one entry here. */
var TOOLS = [
  {
    name: 'Iframe Maker',
    desc: 'Paste a link, see it live and copy ready-to-use embed code for YouTube, Maps, Docs, Spotify and more.',
    href: 'iframe-maker.html',
    cat: 'Embed & links',
    tags: ['iframe', 'embed', 'youtube', 'html'],
    colors: ['#4f46e5', '#7c3aed'],
    icon: '<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>'
  },
  {
    name: 'QR Code Maker',
    desc: 'Turn a link, text, Wi-Fi, email or phone number into a QR code. Pick colors and style, then download PNG or SVG.',
    href: 'qr-maker.html',
    cat: 'Embed & links',
    tags: ['qr', 'wifi', 'png', 'svg'],
    colors: ['#0ea5e9', '#6366f1'],
    icon: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h3M21 17v4"/>'
  },
  {
    name: 'PDF Toolkit',
    desc: 'Merge, split, rotate and optimize PDFs without uploading them anywhere.',
    href: 'pdf-toolkit.html',
    cat: 'Documents',
    tags: ['pdf', 'merge', 'split', 'rotate'],
    colors: ['#ef4444', '#f97316'],
    icon: '<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>'
  },
  {
    name: 'PPTX Media Extractor',
    desc: 'Drop a PowerPoint file and download its images as PNGs, plus any video and audio, bundled in one ZIP.',
    href: 'pptx-images.html',
    cat: 'Documents',
    tags: ['pptx', 'powerpoint', 'images', 'video', 'audio'],
    colors: ['#f97316', '#ec4899'],
    icon: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>'
  },
  {
    name: 'Image to ASCII',
    desc: 'Convert images into ASCII art with contrast, character sets, and TXT or PNG downloads.',
    href: 'image-to-ascii.html',
    cat: 'Images & media',
    tags: ['ascii','image','txt','png'],
    colors: ['#0891b2','#10b981'],
    icon: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 8h3M7 12h10M7 16h7"/>'
  },
  {
    name: 'CSS Glassmorphism Generator',
    desc: 'Create frosted-glass effects with live blur, opacity, border and color controls. Copy the CSS.',
    href: 'glassmorphism-generator.html',
    cat: 'Design',
    tags: ['glass', 'css', 'blur', 'backdrop'],
    colors: ['#7c3aed','#06b6d4'],
    icon: '<rect x="4" y="4" width="14" height="14" rx="3"/><rect x="9" y="9" width="11" height="11" rx="3"/>'
  },
  {
    name: 'CSS Animation Generator',
    desc: 'Design fade, bounce, slide, spin and more animations. Tune timing, easing and repeats, then copy CSS.',
    href: 'css-animation-generator.html',
    cat: 'Design',
    tags: ['animation', 'keyframes', 'css', 'motion', 'effects'],
    colors: ['#6366f1', '#ec4899'],
    icon: '<circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/>'
  },
  {
    name: 'Typography Playground',
    desc: 'Try fonts, weights, sizes, tracking and line spacing in a live preview. Copy CSS instantly.',
    href: 'typography-playground.html',
    cat: 'Design',
    tags: ['typography','fonts','css','text'],
    colors: ['#db2777','#8b5cf6'],
    icon: '<path d="M3 6h18M12 6v15M7 21h10M5 11V6M19 11V6"/>'
  },
  {
    name: 'Metadata Remover',
    desc: 'Remove hidden GPS, camera and EXIF details from PNG, JPG and WebP images. Clean multiple files privately.',
    href: 'metadata-remover.html',
    cat: 'Images & media',
    tags: ['metadata', 'exif', 'gps', 'privacy', 'image', 'clean'],
    colors: ['#0d9488','#6366f1'],
    icon: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>'
  },
  {
    name: 'HEIC Converter',
    desc: 'Convert iPhone HEIC and HEIF photos into JPG, PNG or WebP files right in your browser.',
    href: 'heic-converter.html',
    cat: 'Images & media',
    tags: ['heic', 'heif', 'iphone', 'jpeg', 'jpg', 'convert'],
    colors: ['#0ea5e9','#10b981'],
    icon: '<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 14l3-3 2 2 3-3M8 17h8"/>'
  },
  {
    name: 'Image Privacy Blur',
    desc: 'Hide names, faces and personal details with solid covers, blur or pixelation before sharing images.',
    href: 'image-privacy-blur.html',
    cat: 'Images & media',
    tags: ['privacy', 'blur', 'pixelate', 'redact', 'cover', 'screenshot'],
    colors: ['#db2777','#6366f1'],
    icon: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18M9 15h12"/>'
  }
];
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var grid = $('grid'), chipsEl = $('chips'), q = $('q'), count = $('count'), empty = $('empty');
  var cat = 'All';
  var cats = ['All'];
  TOOLS.forEach(function (t) { if (cats.indexOf(t.cat) < 0) cats.push(t.cat); });

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function matches(t, term) {
    if (cat !== 'All' && t.cat !== cat) return false;
    if (!term) return true;
    var hay = (t.name + ' ' + t.desc + ' ' + t.cat + ' ' + t.tags.join(' ')).toLowerCase();
    return term.toLowerCase().split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }

  function card(t) {
    return '<a class="card" href="' + esc(t.href) + '" style="--c1:' + t.colors[0] + ';--c2:' + t.colors[1] + '">' +
      '<div class="tile" aria-hidden="true"><svg class="i" viewBox="0 0 24 24">' + t.icon + '</svg></div>' +
      '<h2>' + esc(t.name) + '</h2><p>' + esc(t.desc) + '</p>' +
      '<div class="tags">' + t.tags.map(function (g) { return '<span class="tag">' + esc(g) + '</span>'; }).join('') + '</div>' +
      '<span class="open">Open tool <svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>';
  }

  // Keep these five tools first and in this exact order, regardless of TOOLS edits.
  var fixedPages = ['iframe-maker.html', 'qr-maker.html', 'pdf-toolkit.html', 'pptx-images.html', 'image-to-ascii.html'];
  var cssPages = ['glassmorphism-generator.html', 'css-animation-generator.html', 'typography-playground.html'];
  var mainTools = fixedPages.map(function (href) { return TOOLS.find(function (t) { return t.href === href; }); }).filter(Boolean);
  var cssTools = cssPages.map(function (href) { return TOOLS.find(function (t) { return t.href === href; }); }).filter(Boolean);
  // Every other tool is shown before CSS Tools, even when new entries are appended to TOOLS.
  var extraTools = TOOLS.filter(function (t) { return fixedPages.indexOf(t.href) === -1 && cssPages.indexOf(t.href) === -1; });
  var cssExpanded = false;

  function cssGroup(visible, expanded) {
    var markup = '<div class="card css-group' + (expanded ? ' is-open' : '') + '" id="css-tools-group" style="--c1:#7c3aed;--c2:#ec4899">' +
      '<button class="css-toggle" type="button" aria-expanded="' + expanded + '" aria-controls="css-tools-children">' +
      '<span class="tile" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/><path d="M14 4l-4 16"/></svg></span>' +
      '<h2>CSS Tools</h2><p>Glassmorphism, animations and typography generators.</p>' +
      '<span class="open" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></span></button>' +
      '<div class="css-children" id="css-tools-children">' + visible.map(function (t) {
        return '<a class="css-child" href="' + esc(t.href) + '"><span>' + esc(t.name) + '</span><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>';
      }).join('') + '</div></div>';
    return markup;
  }

  function render() {
    var term = q.value.trim();
    var regular = mainTools.filter(function (t) { return matches(t, term); });
    var nested = cssTools.filter(function (t) { return matches(t, term); });
    var extra = extraTools.filter(function (t) { return matches(t, term); });
    // Fixed five, then all other regular tools, then placeholder, with CSS Tools always last.
    var html = regular.map(card).join('') + extra.map(card).join('');
    if (!term && cat === 'All') {
      html += '<div class="card soon"><div class="tile" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><h2>More tools coming</h2><p>New tools will show up here as soon as they are ready.</p></div>';
    }
    if (nested.length) html += cssGroup(nested, cssExpanded || !!term);
    grid.innerHTML = html;
    var n = regular.length + nested.length + extra.length;
    empty.hidden = n > 0 || (!term && cat === 'All');
    empty.textContent = n ? '' : 'No tools match "' + term + '". Try a shorter word.';
    count.textContent = n + (n === 1 ? ' tool' : ' tools');
  }

  grid.addEventListener('click', function (e) {
    var toggle = e.target.closest('.css-toggle');
    if (!toggle) return;
    cssExpanded = !toggle.closest('.css-group').classList.contains('is-open');
    var group = toggle.closest('.css-group');
    group.classList.toggle('is-open', cssExpanded);
    toggle.setAttribute('aria-expanded', String(cssExpanded));
  });

  function renderChips() {
    chipsEl.innerHTML = cats.map(function (c) {
      return '<button class="chip" type="button" data-c="' + esc(c) + '" aria-pressed="' + (c === cat) + '">' + esc(c) + '</button>';
    }).join('');
  }
  chipsEl.addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    cat = b.getAttribute('data-c'); renderChips(); render();
  });
  if (cats.length < 3) chipsEl.hidden = cats.length < 2 ? true : false;

  q.addEventListener('input', render);
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var a = grid.querySelector('a.card'); if (a) a.click(); }
    if (e.key === 'Escape') { q.value = ''; render(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
  });

  /* light / dark (shared by all tools) */
  var root = document.documentElement, theme = $('theme');
  try { var saved = localStorage.getItem('tools-theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
  theme.addEventListener('click', function () {
    var cur = root.getAttribute('data-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('tools-theme', next); } catch (e) {}
  });

  renderChips(); render();
})();
</script>
</body>
</html>
