<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Toolbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Landing page. Every tool is one entry in the TOOLS list at the bottom of this file. */
:root {
  --bg: #f3f4fa;
  --bg-glow: rgba(99, 102, 241, 0.10);
  --surface: #ffffff;
  --surface-2: #f6f7fc;
  --fg: #151a2c;
  --muted: #5d6680;
  --line: #dfe2ee;
  --accent: #4f46e5;
  --accent-2: #7c3aed;
  --accent-soft: rgba(79, 70, 229, 0.10);
  --shadow: 0 1px 2px rgba(20, 26, 60, 0.05), 0 8px 24px -12px rgba(20, 26, 60, 0.16);
  --shadow-up: 0 2px 4px rgba(20, 26, 60, 0.06), 0 18px 36px -16px rgba(79, 70, 229, 0.35);
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f1a; --bg-glow: rgba(124, 92, 255, 0.14); --surface: #131929; --surface-2: #19203a; --fg: #e8ecf6; --muted: #98a2bb; --line: #263049;
    --accent: #8b8cff; --accent-2: #a78bfa; --accent-soft: rgba(139, 140, 255, 0.14);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
    --shadow-up: 0 2px 4px rgba(0, 0, 0, 0.4), 0 18px 36px -16px rgba(139, 140, 255, 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f1a; --bg-glow: rgba(124, 92, 255, 0.14); --surface: #131929; --surface-2: #19203a; --fg: #e8ecf6; --muted: #98a2bb; --line: #263049;
  --accent: #8b8cff; --accent-2: #a78bfa; --accent-soft: rgba(139, 140, 255, 0.14);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px -12px rgba(0, 0, 0, 0.6);
  --shadow-up: 0 2px 4px rgba(0, 0, 0, 0.4), 0 18px 36px -16px rgba(139, 140, 255, 0.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  min-height: 100vh; margin: 0;
  background: var(--bg) radial-gradient(1000px 480px at 80% -10%, var(--bg-glow), transparent 70%) no-repeat;
  background-attachment: fixed;
  color: var(--fg);
  font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(14px, env(safe-area-inset-top, 0px));
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column;
}
.wrap { flex: 1; width: 100%; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 11px; }
.logo { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: #fff; flex: none;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 6px 16px -6px var(--accent); }
.brand b { font-family: var(--font-display); font-size: 1.25rem; letter-spacing: -0.02em; }
.iconbtn { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; box-shadow: var(--shadow); transition: color .15s, border-color .15s; }
.iconbtn:hover { color: var(--fg); border-color: var(--accent); }

.hero { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; }
.hero h1 { font-family: var(--font-display); font-size: clamp(1.9rem, 4.6vw, 2.9rem); line-height: 1.08; letter-spacing: -0.03em; margin: 0; }
.hero h1 span { background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { margin: 0; color: var(--muted); font-size: 1rem; max-width: 560px; }

.controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.search { flex: 1 1 280px; max-width: 460px; display: flex; align-items: center; gap: 9px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 4px 6px 4px 14px; box-shadow: var(--shadow); transition: border-color .15s, box-shadow .15s; }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
.search svg { color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; font-size: 14px; padding: 9px 2px; }
.search input::placeholder { color: var(--muted); opacity: .75; }
.search kbd { font-family: var(--font-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-right: 4px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: inherit; font-size: 13px; font-weight: 500; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; cursor: pointer; transition: color .15s, border-color .15s, background .15s; }
.chip:hover { color: var(--fg); border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.count { margin-left: auto; color: var(--muted); font-size: 12.5px; font-family: var(--font-mono); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.card { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); color: inherit; text-decoration: none; transition: transform .18s, box-shadow .18s, border-color .18s; }
a.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-up); border-color: var(--accent); }
.tile { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--c1, var(--accent)), var(--c2, var(--accent-2))); box-shadow: 0 8px 18px -8px var(--c1, var(--accent)); }
.tile svg { width: 22px; height: 22px; }
.card h2 { font-family: var(--font-display); font-size: 1.12rem; margin: 0; letter-spacing: -0.01em; }
.card p { margin: 0; color: var(--muted); font-size: 13.5px; flex: 1; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 11.5px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
.open { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; color: var(--accent); }
.open svg { width: 15px; height: 15px; transition: transform .18s; }
a.card:hover .open svg { transform: translateX(4px); }
.card.soon { border-style: dashed; background: transparent; box-shadow: none; align-items: flex-start; justify-content: center; min-height: 190px; }
.card.soon .tile { background: var(--surface-2); color: var(--muted); box-shadow: none; border: 1px dashed var(--line); }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }

footer { text-align: center; font-size: 12px; color: var(--muted); letter-spacing: 0.02em; padding-top: 6px; margin-top: auto; }

@media (max-width: 560px) {
  .count { margin-left: 0; }
  .search kbd { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>
      <b>Toolbox</b>
    </div>
    <button class="iconbtn" id="theme" type="button" title="Switch light / dark" aria-label="Switch light or dark theme">
      <svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
  </header>

  <section class="hero">
    <h1>Small tools that <span>just work</span>.</h1>
    <p>Free, fast and private. Everything runs in your browser, so nothing you type is uploaded anywhere.</p>
  </section>

  <section class="controls" aria-label="Find a tool">
    <label class="search">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search tools" aria-label="Search tools">
      <kbd aria-hidden="true">/</kbd>
    </label>
    <div class="chips" id="chips" role="group" aria-label="Category"></div>
    <span class="count" id="count" aria-live="polite"></span>
  </section>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </main>

  <footer>Ufuk Korkmaz - 2026</footer>
</div>

<script>
/* To add a tool: put its .html file next to this page and add one entry here. */
var TOOLS = [
  {
    name: 'Iframe Maker',
    desc: 'Paste a link, see it live and copy ready-to-use embed code for YouTube, Maps, Docs, Spotify and more.',
    href: 'iframe-maker.html',
    cat: 'Embed & links',
    tags: ['iframe', 'embed', 'youtube', 'html'],
    colors: ['#4f46e5', '#7c3aed'],
    icon: '<path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>'
  },
  {
    name: 'QR Code Maker',
    desc: 'Turn a link, text, Wi-Fi, email or phone number into a QR code. Pick colors and style, then download PNG or SVG.',
    href: 'qr-maker.html',
    cat: 'Embed & links',
    tags: ['qr', 'wifi', 'png', 'svg'],
    colors: ['#0ea5e9', '#6366f1'],
    icon: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v.01M14 21h3M21 17v4"/>'
  }
];

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var grid = $('grid'), chipsEl = $('chips'), q = $('q'), count = $('count'), empty = $('empty');
  var cat = 'All';
  var cats = ['All'];
  TOOLS.forEach(function (t) { if (cats.indexOf(t.cat) < 0) cats.push(t.cat); });

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  function matches(t, term) {
    if (cat !== 'All' && t.cat !== cat) return false;
    if (!term) return true;
    var hay = (t.name + ' ' + t.desc + ' ' + t.cat + ' ' + t.tags.join(' ')).toLowerCase();
    return term.toLowerCase().split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
  }

  function card(t) {
    return '<a class="card" href="' + esc(t.href) + '" style="--c1:' + t.colors[0] + ';--c2:' + t.colors[1] + '">' +
      '<div class="tile" aria-hidden="true"><svg class="i" viewBox="0 0 24 24">' + t.icon + '</svg></div>' +
      '<h2>' + esc(t.name) + '</h2><p>' + esc(t.desc) + '</p>' +
      '<div class="tags">' + t.tags.map(function (g) { return '<span class="tag">' + esc(g) + '</span>'; }).join('') + '</div>' +
      '<span class="open">Open tool <svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>';
  }

  function render() {
    var term = q.value.trim();
    var list = TOOLS.filter(function (t) { return matches(t, term); });
    var html = list.map(card).join('');
    if (!term && cat === 'All') {
      html += '<div class="card soon"><div class="tile" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><h2>More tools coming</h2><p>New tools will show up here as soon as they are ready.</p></div>';
    }
    grid.innerHTML = html;
    empty.hidden = list.length > 0 || (!term && cat === 'All');
    empty.textContent = list.length ? '' : 'No tools match "' + term + '". Try a shorter word.';
    count.textContent = list.length + (list.length === 1 ? ' tool' : ' tools');
  }

  function renderChips() {
    chipsEl.innerHTML = cats.map(function (c) {
      return '<button class="chip" type="button" data-c="' + esc(c) + '" aria-pressed="' + (c === cat) + '">' + esc(c) + '</button>';
    }).join('');
  }
  chipsEl.addEventListener('click', function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    cat = b.getAttribute('data-c'); renderChips(); render();
  });
  if (cats.length < 3) chipsEl.hidden = cats.length < 2 ? true : false;

  q.addEventListener('input', render);
  q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var a = grid.querySelector('a.card'); if (a) a.click(); }
    if (e.key === 'Escape') { q.value = ''; render(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
  });

  /* light / dark (shared by all tools) */
  var root = document.documentElement, theme = $('theme');
  try { var saved = localStorage.getItem('tools-theme'); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
  theme.addEventListener('click', function () {
    var cur = root.getAttribute('data-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('tools-theme', next); } catch (e) {}
  });

  renderChips(); render();
})();
</script>
</body>
</html>
