<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap"><title>CSS Glassmorphism Generator — Toolbox</title><style>
:root{--bg:#f3f4fa;--surface:#fff;--surface2:#f6f7fc;--fg:#151a2c;--muted:#5d6680;--line:#dfe2ee;--accent:#4f46e5;--accent2:#7c3aed;--shadow:0 8px 24px -12px rgba(20,26,60,.16);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0f1a;--surface:#131929;--surface2:#19203a;--fg:#e8ecf6;--muted:#98a2bb;--line:#263049;--accent:#8b8cff;--accent2:#a78bfa;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0b0f1a;--surface:#131929;--surface2:#19203a;--fg:#e8ecf6;--muted:#98a2bb;--line:#263049;--accent:#8b8cff;--accent2:#a78bfa;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif;padding:18px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:inherit}main{max-width:1200px;margin:auto}header{display:flex;align-items:center;gap:12px;margin-bottom:23px}header h1{font-family:'Space Grotesk',sans-serif;font-size:1.45rem;margin:0}header p{margin:1px 0;color:var(--muted);font-size:13px}.logo{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;color:#fff;font-size:21px;background:linear-gradient(135deg,#4f46e5,#7c3aed)}.spacer{flex:1}.back,.theme{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-decoration:none;color:var(--fg)}.theme{padding:8px 10px}.layout{display:grid;grid-template-columns:minmax(285px,380px) minmax(0,1fr);gap:18px;align-items:start}.panel{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow)}h2{font:700 1rem 'Space Grotesk',sans-serif;margin:0 0 15px}.controls{display:grid;gap:17px}.control{display:grid;gap:7px}.control>label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.val{font:12px 'JetBrains Mono',monospace;color:var(--accent)}input[type=range]{width:100%;accent-color:var(--accent)}input[type=color]{width:42px;height:38px;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface2)}input[type=text],input[type=number],select,textarea{width:100%;min-width:0;padding:10px;border-radius:10px;color:var(--fg);background:var(--surface2);border:1px solid var(--line)}textarea{resize:vertical}.buttons{display:flex;flex-wrap:wrap;gap:8px}.btn{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;border:0;border-radius:10px;padding:10px 14px;font-weight:600}.btn.secondary{background:var(--surface2);border:1px solid var(--line);color:var(--fg)}.hint{color:var(--muted);font-size:12px;margin:0}.preview{min-height:390px;overflow:hidden}.preview-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.preview-heading h2{margin:0}.code{margin:14px 0 0;padding:14px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;color:var(--fg);font:12px/1.6 'JetBrains Mono',monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto}.row{display:flex;align-items:center;gap:10px}.row>*{min-width:0}.row>input[type=text]{flex:1} :focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:760px){body{padding:12px}.layout{grid-template-columns:1fr}.panel{padding:15px}.preview{min-height:300px}header p{display:none}}
.stage{min-height:440px;border-radius:14px;display:grid;place-items:center;position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(130deg,var(--from),var(--to))}.orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.85}.orb.one{width:230px;height:230px;background:#f472b6;top:-50px;left:-70px}.orb.two{width:220px;height:220px;background:#38bdf8;bottom:-65px;right:-40px}.orb.three{width:100px;height:100px;background:#facc15;top:20%;right:18%}.glass{position:relative;width:min(85%,365px);min-height:240px;padding:30px;display:flex;flex-direction:column;justify-content:center;color:var(--glassfg);border:var(--borderpx) solid var(--bordercolor);border-radius:var(--radius);background:var(--glassbg);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:0 8px var(--shadowblur) rgba(0,0,0,var(--shadowopacity))}.glass h3{font:700 27px 'Space Grotesk',sans-serif;margin:0 0 12px}.glass p{font-size:14px;margin:0 0 16px}.glass span{display:inline-block;padding:7px 13px;border-radius:30px;border:1px solid currentColor;width:max-content;font-size:12px}.colorrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}.colorrow label{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px}.presets{display:flex;gap:8px;flex-wrap:wrap}.presets button{background:var(--surface2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:7px 11px}</style></head><body><main><header><div class="logo" aria-hidden="true">◈</div><div><h1>CSS Glassmorphism Generator</h1><p>Create frosted-glass panels with customizable CSS.</p></div><div class="spacer"></div><a class="back" href="index.html">← Tools</a><button class="theme" id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button></header><div class="layout"><section class="panel"><h2>Glass settings</h2><div class="controls"><div class="presets"><button data-preset="frost">Frost</button><button data-preset="dark">Dark</button><button data-preset="color">Colorful</button></div><div class="control"><div class="between"><label for="blur">Backdrop blur</label><output id="blurVal" class="val"></output></div><input type="range" id="blur" min="0" max="50" value="20"></div><div class="control"><div class="between"><label for="opacity">Background opacity</label><output id="opacityVal" class="val"></output></div><input type="range" id="opacity" min="0" max="100" value="22"></div><div class="control"><div class="between"><label for="radius">Corner radius</label><output id="radiusVal" class="val"></output></div><input type="range" id="radius" min="0" max="60" value="24"></div><div class="control"><div class="between"><label for="border">Border width</label><output id="borderVal" class="val"></output></div><input type="range" id="border" min="0" max="5" value="1"></div><div class="control"><div class="between"><label for="shadow">Shadow strength</label><output id="shadowVal" class="val"></output></div><input type="range" id="shadow" min="0" max="100" value="22"></div><div class="colorrow"><label>Glass color <input type="color" id="glassColor" value="#ffffff"></label><label>Text color <input type="color" id="textColor" value="#ffffff"></label><label>Border color <input type="color" id="borderColor" value="#ffffff"></label><label>Backdrop start <input type="color" id="startColor" value="#4338ca"></label><label>Backdrop end <input type="color" id="endColor" value="#0f172a"></label></div><div class="buttons"><button class="btn" id="copy">Copy CSS</button><button class="btn secondary" id="reset">Reset</button></div></div></section><section class="panel preview"><div class="preview-heading"><h2>Live preview</h2><span class="hint">Drag the sliders</span></div><div class="stage" id="stage"><div class="orb one"></div><div class="orb two"></div><div class="orb three"></div><div class="glass" id="glass"><h3>Glass effect</h3><p>A soft, translucent surface that blurs whatever sits behind it.</p><span>Live preview ✦</span></div></div><pre class="code" id="cssCode"></pre></section></div></main><script>
const $=id=>document.getElementById(id);const saved=localStorage.getItem('toolbox-theme');if(saved)document.documentElement.dataset.theme=saved;$('theme').onclick=()=>{let current=document.documentElement.dataset.theme;let next=current==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('toolbox-theme',next)};async function copyText(text,button){try{await navigator.clipboard.writeText(text)}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}if(button){let orig=button.textContent;button.textContent='Copied!';setTimeout(()=>button.textContent=orig,1300)}}function downloadBlob(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
const keys=['blur','opacity','radius','border','shadow','glassColor','textColor','borderColor','startColor','endColor'];const defaults={blur:20,opacity:22,radius:24,border:1,shadow:22,glassColor:'#ffffff',textColor:'#ffffff',borderColor:'#ffffff',startColor:'#4338ca',endColor:'#0f172a'};const presets={frost:defaults,dark:{...defaults,opacity:55,glassColor:'#121936',textColor:'#ffffff',startColor:'#0f172a',endColor:'#4338ca'},color:{...defaults,opacity:38,glassColor:'#fca5a5',startColor:'#f97316',endColor:'#7c3aed',blur:30}};function hexrgb(hex){return [1,3,5].map(n=>parseInt(hex.slice(n,n+2),16)).join(', ')}function render(){for(const k of ['blur','opacity','radius','border','shadow'])$(k+'Val').textContent=$(k).value+({blur:'px',opacity:'%',radius:'px',border:'px',shadow:'%'}[k]);const v=k=>$(k).value;let glassbg=`rgba(${hexrgb(v('glassColor'))}, ${(v('opacity')/100).toFixed(2)})`,bordercolor=`rgba(${hexrgb(v('borderColor'))}, 0.5)`,shadowopacity=(v('shadow')/250).toFixed(2);const stage=$('stage'),g=$('glass');stage.style.setProperty('--from',v('startColor'));stage.style.setProperty('--to',v('endColor'));for(const [key,value] of Object.entries({'--glassbg':glassbg,'--glassfg':v('textColor'),'--bordercolor':bordercolor,'--borderpx':v('border')+'px','--radius':v('radius')+'px','--blur':v('blur')+'px','--shadowblur':'32px','--shadowopacity':shadowopacity}))g.style.setProperty(key,value);$('cssCode').textContent=`.glass {
  background: ${glassbg};
  backdrop-filter: blur(${v('blur')}px);
  -webkit-backdrop-filter: blur(${v('blur')}px);
  border: ${v('border')}px solid ${bordercolor};
  border-radius: ${v('radius')}px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, ${shadowopacity});
  color: ${v('textColor')};
}`}keys.forEach(k=>$(k).addEventListener('input',render));document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{let p=presets[b.dataset.preset];keys.forEach(k=>$(k).value=p[k]);render()});$('reset').onclick=()=>{keys.forEach(k=>$(k).value=defaults[k]);render()};$('copy').onclick=()=>copyText($('cssCode').textContent,$('copy'));render();</script></body></html>
