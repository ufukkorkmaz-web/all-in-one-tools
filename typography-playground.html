<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap"><title>Typography Playground — Toolbox</title><style>
:root{--bg:#f3f4fa;--surface:#fff;--surface2:#f6f7fc;--fg:#151a2c;--muted:#5d6680;--line:#dfe2ee;--accent:#4f46e5;--accent2:#7c3aed;--shadow:0 8px 24px -12px rgba(20,26,60,.16);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0f1a;--surface:#131929;--surface2:#19203a;--fg:#e8ecf6;--muted:#98a2bb;--line:#263049;--accent:#8b8cff;--accent2:#a78bfa;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0b0f1a;--surface:#131929;--surface2:#19203a;--fg:#e8ecf6;--muted:#98a2bb;--line:#263049;--accent:#8b8cff;--accent2:#a78bfa;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif;padding:18px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:inherit}main{max-width:1200px;margin:auto}header{display:flex;align-items:center;gap:12px;margin-bottom:23px}header h1{font-family:'Space Grotesk',sans-serif;font-size:1.45rem;margin:0}header p{margin:1px 0;color:var(--muted);font-size:13px}.logo{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;color:#fff;font-size:21px;background:linear-gradient(135deg,#4f46e5,#7c3aed)}.spacer{flex:1}.back,.theme{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-decoration:none;color:var(--fg)}.theme{padding:8px 10px}.layout{display:grid;grid-template-columns:minmax(285px,380px) minmax(0,1fr);gap:18px;align-items:start}.panel{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow)}h2{font:700 1rem 'Space Grotesk',sans-serif;margin:0 0 15px}.controls{display:grid;gap:17px}.control{display:grid;gap:7px}.control>label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.val{font:12px 'JetBrains Mono',monospace;color:var(--accent)}input[type=range]{width:100%;accent-color:var(--accent)}input[type=color]{width:42px;height:38px;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface2)}input[type=text],input[type=number],select,textarea{width:100%;min-width:0;padding:10px;border-radius:10px;color:var(--fg);background:var(--surface2);border:1px solid var(--line)}textarea{resize:vertical}.buttons{display:flex;flex-wrap:wrap;gap:8px}.btn{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;border:0;border-radius:10px;padding:10px 14px;font-weight:600}.btn.secondary{background:var(--surface2);border:1px solid var(--line);color:var(--fg)}.hint{color:var(--muted);font-size:12px;margin:0}.preview{min-height:390px;overflow:hidden}.preview-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.preview-heading h2{margin:0}.code{margin:14px 0 0;padding:14px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;color:var(--fg);font:12px/1.6 'JetBrains Mono',monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto}.row{display:flex;align-items:center;gap:10px}.row>*{min-width:0}.row>input[type=text]{flex:1} :focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:760px){body{padding:12px}.layout{grid-template-columns:1fr}.panel{padding:15px}.preview{min-height:300px}header p{display:none}}
.type-stage{min-height:330px;border:1px dashed var(--line);border-radius:14px;padding:30px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;background:var(--surface2)}.type-preview{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4}.type-meta{margin-top:24px;color:var(--muted);font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.type-preview:focus{outline:2px dashed var(--accent);outline-offset:8px}.sample-actions{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><main><header><div class="logo" aria-hidden="true">Aa</div><div><h1>Typography Playground</h1><p>Experiment with type styles and copy the CSS.</p></div><div class="spacer"></div><a class="back" href="index.html">← Tools</a><button class="theme" id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button></header><div class="layout"><section class="panel"><h2>Typography controls</h2><div class="controls"><div class="control"><label for="font">Font family</label><select id="font"><option value="Inter, sans-serif">Inter</option><option value="'Space Grotesk', sans-serif">Space Grotesk</option><option value="'JetBrains Mono', monospace">JetBrains Mono</option><option value="Georgia, serif">Georgia</option><option value="Arial, sans-serif">Arial</option><option value="'Times New Roman', serif">Times New Roman</option><option value="system-ui, sans-serif">System UI</option></select></div><div class="two"><div class="control"><label for="weight">Font weight</label><select id="weight"><option>400</option><option>500</option><option>600</option><option selected>700</option></select></div><div class="control"><label for="align">Alignment</label><select id="align"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select></div></div><div class="control"><div class="between"><label for="size">Font size</label><output class="val" id="sizeVal"></output></div><input id="size" type="range" min="12" max="100" value="44"></div><div class="control"><div class="between"><label for="lineHeight">Line height</label><output class="val" id="lineHeightVal"></output></div><input id="lineHeight" type="range" min="80" max="250" value="125"></div><div class="control"><div class="between"><label for="tracking">Letter spacing</label><output class="val" id="trackingVal"></output></div><input id="tracking" type="range" min="-5" max="15" step="0.5" value="-1"></div><div class="control"><label for="transform">Text transform</label><select id="transform"><option value="none">Normal</option><option value="uppercase">UPPERCASE</option><option value="lowercase">lowercase</option><option value="capitalize">Capitalize</option></select></div><div class="two"><div class="control"><label for="ink">Text color</label><input id="ink" type="color" value="#4f46e5"></div><div class="control"><label for="paper">Background color</label><input id="paper" type="color" value="#f6f7fc"></div></div><div class="buttons"><button class="btn" id="copy">Copy CSS</button><button class="btn secondary" id="reset">Reset</button></div></div></section><section class="panel preview"><div class="preview-heading"><h2>Live preview</h2><span class="hint">Edit the text below</span></div><div class="control"><label for="sample">Sample text</label><textarea id="sample" rows="3">Make something beautiful.
Typography makes a difference.</textarea></div><div class="type-stage" id="stage"><p class="type-preview" id="typePreview"></p><div class="type-meta" id="meta"></div></div><pre class="code" id="cssCode"></pre></section></div></main><script>
const $=id=>document.getElementById(id);const saved=localStorage.getItem('toolbox-theme');if(saved)document.documentElement.dataset.theme=saved;$('theme').onclick=()=>{let current=document.documentElement.dataset.theme;let next=current==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('toolbox-theme',next)};async function copyText(text,button){try{await navigator.clipboard.writeText(text)}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}if(button){let orig=button.textContent;button.textContent='Copied!';setTimeout(()=>button.textContent=orig,1300)}}function downloadBlob(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
const ids=['font','weight','align','size','lineHeight','tracking','transform','ink','paper','sample'];const init=Object.fromEntries(ids.map(id=>[id,$(id).value]));function render(){let v=id=>$(id).value;let props={'font-family':v('font'),'font-size':v('size')+'px','font-weight':v('weight'),'line-height':(v('lineHeight')/100).toFixed(2),'letter-spacing':v('tracking')+'px','text-align':v('align'),'text-transform':v('transform'),'color':v('ink')};$('typePreview').textContent=v('sample');for(let [key,val] of Object.entries(props))$('typePreview').style.setProperty(key,val);$('stage').style.backgroundColor=v('paper');$('sizeVal').textContent=v('size')+'px';$('lineHeightVal').textContent=(v('lineHeight')/100).toFixed(2);$('trackingVal').textContent=v('tracking')+'px';$('meta').textContent=v('font')+' · '+v('size')+'px · weight '+v('weight');$('cssCode').textContent='.typography {\n'+Object.entries(props).map(([k,v])=>'  '+k+': '+v+';').join('\n')+'\n}'}ids.forEach(k=>$(k).addEventListener('input',render));$('copy').onclick=()=>copyText($('cssCode').textContent,$('copy'));$('reset').onclick=()=>{for(let k of ids)$(k).value=init[k];render()};render();</script></body></html>
