<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap"><title>Image to ASCII — Toolbox</title><style>
:root{--bg:#f3f4fa;--surface:#fff;--surface2:#f6f7fc;--fg:#151a2c;--muted:#5d6680;--line:#dfe2ee;--accent:#4f46e5;--accent2:#7c3aed;--shadow:0 8px 24px -12px rgba(20,26,60,.16);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0f1a;--surface:#131929;--surface2:#19203a;--fg:#e8ecf6;--muted:#98a2bb;--line:#263049;--accent:#8b8cff;--accent2:#a78bfa;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0b0f1a;--surface:#131929;--surface2:#19203a;--fg:#e8ecf6;--muted:#98a2bb;--line:#263049;--accent:#8b8cff;--accent2:#a78bfa;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,sans-serif;padding:18px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}a{color:inherit}main{max-width:1200px;margin:auto}header{display:flex;align-items:center;gap:12px;margin-bottom:23px}header h1{font-family:'Space Grotesk',sans-serif;font-size:1.45rem;margin:0}header p{margin:1px 0;color:var(--muted);font-size:13px}.logo{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;color:#fff;font-size:21px;background:linear-gradient(135deg,#4f46e5,#7c3aed)}.spacer{flex:1}.back,.theme{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;text-decoration:none;color:var(--fg)}.theme{padding:8px 10px}.layout{display:grid;grid-template-columns:minmax(285px,380px) minmax(0,1fr);gap:18px;align-items:start}.panel{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow)}h2{font:700 1rem 'Space Grotesk',sans-serif;margin:0 0 15px}.controls{display:grid;gap:17px}.control{display:grid;gap:7px}.control>label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.val{font:12px 'JetBrains Mono',monospace;color:var(--accent)}input[type=range]{width:100%;accent-color:var(--accent)}input[type=color]{width:42px;height:38px;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface2)}input[type=text],input[type=number],select,textarea{width:100%;min-width:0;padding:10px;border-radius:10px;color:var(--fg);background:var(--surface2);border:1px solid var(--line)}textarea{resize:vertical}.buttons{display:flex;flex-wrap:wrap;gap:8px}.btn{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;border:0;border-radius:10px;padding:10px 14px;font-weight:600}.btn.secondary{background:var(--surface2);border:1px solid var(--line);color:var(--fg)}.hint{color:var(--muted);font-size:12px;margin:0}.preview{min-height:390px;overflow:hidden}.preview-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.preview-heading h2{margin:0}.code{margin:14px 0 0;padding:14px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;color:var(--fg);font:12px/1.6 'JetBrains Mono',monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto}.row{display:flex;align-items:center;gap:10px}.row>*{min-width:0}.row>input[type=text]{flex:1} :focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:760px){body{padding:12px}.layout{grid-template-columns:1fr}.panel{padding:15px}.preview{min-height:300px}header p{display:none}}
.drop{border:2px dashed var(--line);border-radius:13px;padding:18px;text-align:center;background:var(--surface2);transition:border .2s;cursor:pointer}.drop.drag{border-color:var(--accent)}.drop strong{display:block}.drop input{display:none}.ascii{margin:0;white-space:pre;font:8px/1 monospace;letter-spacing:0;overflow:auto;max-height:520px;color:var(--fg);background:var(--surface2);padding:16px;border:1px solid var(--line);border-radius:13px}.ascii-wrap{overflow:auto;max-width:100%}.inline{display:flex;align-items:center;gap:9px;font-size:13px}.inline input{accent-color:var(--accent)}.filename{color:var(--muted);font-size:12px;overflow-wrap:anywhere}canvas{display:none}.result{min-height:300px}.note{font-size:12px;color:var(--muted)}</style></head><body><main><header><div class="logo" aria-hidden="true">▦</div><div><h1>Image to ASCII</h1><p>Transform your pictures into text art, right in your browser.</p></div><div class="spacer"></div><a class="back" href="index.html">← Tools</a><button class="theme" id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button></header><div class="layout"><section class="panel"><h2>Image settings</h2><div class="controls"><label class="drop" id="drop" for="imageInput"><strong>Choose or drop an image</strong><span class="hint">PNG, JPG, WebP, GIF (first frame), and other browser-supported images</span><input id="imageInput" type="file" accept="image/*"></label><p id="filename" class="filename">No image selected. A sample gradient is shown below.</p><div class="control"><div class="between"><label for="width">Character width</label><output id="widthVal" class="val"></output></div><input type="range" min="20" max="180" value="90" id="width"></div><div class="control"><label for="charset">Character set</label><select id="charset"><option value="standard">Standard (@%#*+=-:. )</option><option value="dense">Detailed (high contrast)</option><option value="blocks">Block characters</option><option value="binary">Binary (0 and 1)</option></select></div><div class="control"><div class="between"><label for="contrast">Contrast</label><output id="contrastVal" class="val"></output></div><input type="range" min="50" max="200" value="110" id="contrast"></div><label class="inline"><input type="checkbox" id="invert"> Invert brightness</label><label class="inline"><input type="checkbox" id="color"> Colorize characters (PNG/preview)</label><div class="buttons"><button class="btn" id="txt">Download TXT</button><button class="btn secondary" id="png">Download PNG</button><button class="btn secondary" id="copy">Copy text</button></div><p class="note">Files are processed locally. Very large images are scaled down before conversion.</p></div></section><section class="panel preview result"><div class="preview-heading"><h2>ASCII preview</h2><span id="dimensions" class="hint"></span></div><div class="ascii-wrap"><pre class="ascii" id="ascii" aria-label="Generated ASCII art"></pre></div><canvas id="canvas"></canvas></section></div></main><script>
const $=id=>document.getElementById(id);const saved=localStorage.getItem('toolbox-theme');if(saved)document.documentElement.dataset.theme=saved;$('theme').onclick=()=>{let current=document.documentElement.dataset.theme;let next=current==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('toolbox-theme',next)};async function copyText(text,button){try{await navigator.clipboard.writeText(text)}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}if(button){let orig=button.textContent;button.textContent='Copied!';setTimeout(()=>button.textContent=orig,1300)}}function downloadBlob(blob,name){let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
let image=null,rows=[],rgbRows=[];const imgInput=$('imageInput');function sample(){let c=document.createElement('canvas');c.width=320;c.height=180;let x=c.getContext('2d'),g=x.createLinearGradient(0,0,320,180);g.addColorStop(0,'#25258a');g.addColorStop(.5,'#8e44ad');g.addColorStop(1,'#ffb347');x.fillStyle=g;x.fillRect(0,0,320,180);x.fillStyle='rgba(255,255,255,.92)';x.font='bold 85px sans-serif';x.textAlign='center';x.fillText('ASCII',160,118);return c}image=sample();function load(file){if(!file||!file.type.startsWith('image/')){$('filename').textContent='Please choose a supported image.';return}if(file.size>40*1024*1024){$('filename').textContent='Image is too large (40 MB limit).';return}let url=URL.createObjectURL(file),im=new Image();im.onload=()=>{image=im;$('filename').textContent=file.name;render();URL.revokeObjectURL(url)};im.onerror=()=>{$('filename').textContent='Could not read this image.';URL.revokeObjectURL(url)};im.src=url}imgInput.onchange=()=>load(imgInput.files[0]);const drop=$('drop');drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');load(e.dataTransfer.files[0])};const sets={standard:'@%#*+=-:. ',dense:'@B%8&WM#*oahkbdpqwmZO0QLCJUYXzcvunxrjft/|()1{}[]?-_+~<>i!lI;:,. ',blocks:'█▓▒░ ',binary:'10'};function render(){if(!image)return;let width=+$('width').value,contrast=+$('contrast').value/100,inv=$('invert').checked;const sourceWidth=image.naturalWidth||image.width,sourceHeight=image.naturalHeight||image.height;let height=Math.max(1,Math.min(220,Math.round(sourceHeight/sourceWidth*width*.48)));let c=document.createElement('canvas');c.width=width;c.height=height;let ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(image,0,0,width,height);let data=ctx.getImageData(0,0,width,height).data,chars=sets[$('charset').value];rows=[];rgbRows=[];for(let y=0;y<height;y++){let row='',colors=[];for(let x=0;x<width;x++){let i=(y*width+x)*4,r=data[i],g=data[i+1],b=data[i+2],a=data[i+3]/255;let light=((.2126*r+.7152*g+.0722*b)*a+255*(1-a))/255;light=Math.max(0,Math.min(1,(light-.5)*contrast+.5));if(inv)light=1-light;let char=chars[Math.min(chars.length-1,Math.floor(light*(chars.length-1)))];row+=char;colors.push([Math.round(r*a+255*(1-a)),Math.round(g*a+255*(1-a)),Math.round(b*a+255*(1-a))])}rows.push(row);rgbRows.push(colors)}$('widthVal').textContent=width;$('contrastVal').textContent=Math.round(contrast*100)+'%';$('dimensions').textContent=width+' × '+height+' characters';let output=$('ascii');output.textContent=rows.join('\n');output.style.fontSize=(width>130?6:width>95?7:9)+'px';if($('color').checked){output.textContent='';rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){let s=document.createElement('span');s.textContent=r[x];s.style.color='rgb('+rgbRows[y][x].join(',')+')';output.appendChild(s)}output.appendChild(document.createTextNode('\n'))})} }['width','contrast','charset','invert','color'].forEach(k=>$(k).addEventListener('input',render));$('copy').onclick=()=>copyText(rows.join('\n'),$('copy'));$('txt').onclick=()=>downloadBlob(new Blob([rows.join('\n')],{type:'text/plain;charset=utf-8'}),'ascii-art.txt');$('png').onclick=()=>{let size=12,c=$('canvas'),ctx=c.getContext('2d');c.width=rows[0].length*size*.62+24;c.height=rows.length*size+24;ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);ctx.font=size+'px monospace';ctx.textBaseline='top';for(let y=0;y<rows.length;y++)for(let x=0;x<rows[y].length;x++){let col=rgbRows[y][x];ctx.fillStyle=$('color').checked?'rgb('+col.join(',')+')':'#151a2c';ctx.fillText(rows[y][x],12+x*size*.62,12+y*size)}c.toBlob(blob=>{if(blob)downloadBlob(blob,'ascii-art.png')},'image/png')};render();</script></body></html>
